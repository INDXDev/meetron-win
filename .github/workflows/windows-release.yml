name: Windows signed release

on:
  workflow_dispatch:
    inputs:
      release-ref:
        description: Signed tag or commit to package (manual runs do not publish)
        required: true
        type: string
      beta:
        description: Publish through the mutable beta App Installer channel
        required: true
        default: true
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

env:
  # Fixed, mutable GitHub release that carries nothing but the beta App Installer
  # feed. Beta installations poll it forever, so its assets are replaced -- never
  # re-tagged -- on each beta release.
  BETA_CHANNEL_TAG: beta

jobs:
  package-sign-verify:
    name: Build, HSM-sign, and verify Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    environment: windows-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release-ref }}

      - name: Set up bundled Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Require release identity and HSM signing configuration
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $required = @(
            'WINDOWS_SIGNING_PUBLISHER', 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID',
            'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT', 'ARTIFACT_SIGNING_PROFILE'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Missing fail-closed Windows release setting: $name"
            }
          }
          if ($env:WINDOWS_SIGNING_PUBLISHER -eq 'CN=Meetron Local Test') {
            throw 'The local test publisher cannot sign a release.'
          }

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build:windows
      - run: npm test
        env:
          MEETING_COPILOT_SKIP_BROWSER_TEST: '1'
          MEETRON_TEST_NATIVE_REGISTRY: '1'
      - run: npm run test:windows

      - name: Compute release names and update feed
        id: release
        shell: pwsh
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.release-ref }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_BETA: ${{ inputs.beta }}
          BETA_CHANNEL_TAG: ${{ env.BETA_CHANNEL_TAG }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = if ($env:EVENT_TAG) { $env:EVENT_TAG } else { $env:INPUT_REF }
          $artifact = "Meetron-$version-windows-x64.msix"
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases"
          $packageUri = "$base/download/$tag/$artifact"
          $beta = $env:EVENT_PRERELEASE -eq 'true' -or $env:INPUT_BETA -eq 'true'
          # App Installer polls exactly the URI baked into the installed package,
          # forever. A beta feed published under its own release tag is immutable,
          # so beta users could never receive another build -- including a security
          # fix. Beta therefore publishes at the fixed, mutable 'beta' release tag
          # whose Meetron-beta.appinstaller asset is replaced on every beta release;
          # stable keeps the /releases/latest/download alias. Only the MSIX Uri
          # inside the feed stays version-pinned.
          $appInstaller = if ($beta) { 'Meetron-beta.appinstaller' } else { 'Meetron.appinstaller' }
          $appInstallerUri = if ($beta) {
            "$base/download/$env:BETA_CHANNEL_TAG/$appInstaller"
          } else {
            "$base/latest/download/$appInstaller"
          }
          "artifact=$artifact" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "beta=$(if ($beta) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "appinstaller=$appInstaller" >> $env:GITHUB_OUTPUT
          "package-uri=$packageUri" >> $env:GITHUB_OUTPUT
          "appinstaller-uri=$appInstallerUri" >> $env:GITHUB_OUTPUT

      - name: Stage unsigned Windows package
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        run: >-
          npm run package:windows --
          --stage-only --stage-dir dist/windows/release-stage --skip-build
          --publisher "$env:WINDOWS_SIGNING_PUBLISHER"

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: HSM-sign packaged executables and libraries
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\windows\release-stage
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify every staged Authenticode signature
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        run: >-
          npm run verify:windows-package --
          --stage dist/windows/release-stage
          --publisher "$env:WINDOWS_SIGNING_PUBLISHER" --require-release

      - name: Pack signed files into MSIX and App Installer feed
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          # These are derived from the release tag, which a release author
          # controls. Expanding them into the script body would let a tag such
          # as "v1$(...)" execute inside this HSM-signing job, so they have to
          # arrive as environment values rather than as template text.
          PACKAGE_URI: ${{ steps.release.outputs.package-uri }}
          APPINSTALLER_URI: ${{ steps.release.outputs.appinstaller-uri }}
        run: >-
          npm run package:windows --
          --pack-stage dist/windows/release-stage --output-dir dist/windows
          --publisher "$env:WINDOWS_SIGNING_PUBLISHER"
          --package-uri "$env:PACKAGE_URI"
          --appinstaller-uri "$env:APPINSTALLER_URI"

      - name: HSM-sign MSIX
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\windows\${{ steps.release.outputs.artifact }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Checksum the signed MSIX and verify distributed files
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact }}
          APPINSTALLER_NAME: ${{ steps.release.outputs.appinstaller }}
        run: |
          $artifact = "dist/windows/${env:ARTIFACT_NAME}"
          npm run package:windows -- --checksum $artifact
          npm run verify:windows-package -- `
            --msix $artifact --appinstaller "dist/windows/${env:APPINSTALLER_NAME}" `
            --publisher "$env:WINDOWS_SIGNING_PUBLISHER" --require-release `
            --release-repository "$env:GITHUB_REPOSITORY"

      - name: Upload verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Meetron-Windows-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          path: |
            dist/windows/${{ steps.release.outputs.artifact }}
            dist/windows/${{ steps.release.outputs.artifact }}.sha256
            dist/windows/${{ steps.release.outputs.appinstaller }}
            dist/windows/${{ steps.release.outputs.appinstaller }}.sha256

      - name: Attach verified assets to the published GitHub release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact }}
          APPINSTALLER_NAME: ${{ steps.release.outputs.appinstaller }}
        run: >-
          gh release upload "${env:RELEASE_TAG}"
          "dist/windows/${env:ARTIFACT_NAME}"
          "dist/windows/${env:ARTIFACT_NAME}.sha256"
          "dist/windows/${env:APPINSTALLER_NAME}"
          "dist/windows/${env:APPINSTALLER_NAME}.sha256"

      # The beta feed URI is fixed, so the asset behind it has to be replaced in
      # place. Without this the beta channel would still be a one-shot feed.
      - name: Refresh the mutable beta App Installer feed
        if: github.event_name == 'release' && steps.release.outputs.beta == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_CHANNEL_TAG: ${{ env.BETA_CHANNEL_TAG }}
          APPINSTALLER_NAME: ${{ steps.release.outputs.appinstaller }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view "${env:BETA_CHANNEL_TAG}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${env:BETA_CHANNEL_TAG}" --prerelease `
              --title 'Meetron Windows beta update feed' `
              --notes 'Mutable App Installer feed for the Meetron Windows beta channel. Signed MSIX builds stay on their own version releases; only this descriptor is replaced.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the beta update feed release.' }
          }
          gh release upload "${env:BETA_CHANNEL_TAG}" `
            "dist/windows/${env:APPINSTALLER_NAME}" `
            "dist/windows/${env:APPINSTALLER_NAME}.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not refresh the beta App Installer feed.' }
          Write-Host "[release] beta feed now points at ${env:RELEASE_TAG}"
