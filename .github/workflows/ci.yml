name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform-tests:
    name: test (${{ matrix.runner }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            node: 22
          - runner: macos-15-intel
            node: 24
          - runner: windows-latest
            node: 22
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: runner.os == 'Windows'
        run: npm run build:windows
      - run: npm test
        env:
          MEETING_COPILOT_SKIP_BROWSER_TEST: "1"
          MEETRON_TEST_NATIVE_REGISTRY: ${{ runner.os == 'Windows' && '1' || '0' }}
      - if: runner.os == 'Windows'
        run: npm run test:windows
      - if: runner.os == 'macOS'
        run: npm run test:native
      - if: runner.os == 'macOS'
        run: npm run package:audio
      - if: runner.os == 'macOS'
        run: npm run test:package
      - run: npm audit --audit-level=high

  test:
    if: always()
    needs: platform-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform test job to pass
        run: test '${{ needs.platform-tests.result }}' = 'success'
